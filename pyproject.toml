[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "truetrade-rl-bot"
version = "0.1.0"
description = "Demo-only TheTrueTrade RL research and execution system"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
gym = ["gymnasium>=1.0,<2"]

[project.scripts]
truetrade = "truetrade.main:main"

[tool.setuptools.packages.find]
include = ["truetrade*", "scripts*"]
